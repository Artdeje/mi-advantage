# Render Blueprint — one Web Service hosts the React frontend + API + email.
# Apply: `render blueprint launch` or connect the repo in the Render dashboard
# (the dashboard reads this file and pre-fills Build / Start commands).
#
# DATABASE — Supabase (Postgres). Before first deploy:
#   1. Create a project at https://supabase.com/dashboard
#   2. Run supabase-schema.sql once in the Supabase Dashboard → SQL Editor
#   3. Set SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY below (dashboard env vars).
#      Use the "secret" service_role key — NEVER the anon key, and never in VITE_*.
# Existing MySQL data? Start local MySQL (XAMPP) and run once:
#   SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... npm run db:seed-supabase
# Fresh database? The app seeds defaults itself: POST /api/db/seed once online.
services:
  - type: web
    name: mi-advantage
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Frontend calls the SAME origin in production — keep both empty so
      # fetch("/api/...") hits this service (no CORS, no extra config).
      - key: VITE_API_URL
        value: ""
      - key: VITE_EMAIL_API_URL
        value: ""
      # --- Supabase (Project Settings → API) ---
      # Live project: https://wbldciermnpgmlsookrs.supabase.co
      # Paste the anon key into SUPABASE_ANON_KEY (works with the project's
      # public RLS policies). Upgrade path: paste the "secret" service_role
      # key into SUPABASE_SERVICE_ROLE_KEY + lock down RLS (supabase-schema.sql).
      - key: SUPABASE_URL
        value: https://wbldciermnpgmlsookrs.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Gmail SMTP (App Password, no spaces) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
